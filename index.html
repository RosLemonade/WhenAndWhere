<!DOCTYPE html>
<html>
<head>
  <title>Ro's Lemonade</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #fff8dc; }
    h1 { color: #e07a5f; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background-color: #f4a261; color: white; }
    .map { display: none; margin-top: 20px; }
    .map.active { display: block; }
    button { padding: 5px 10px; background-color: #2a9d8f; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background-color: #21867a; }
  </style>
  <script>
  function toggleMap(id) {
    const map = document.getElementById(id);
    if (map.classList.contains('active')) {
      map.classList.remove('active');
    } else {
      // Hide all maps
      const maps = document.querySelectorAll('.map');
      maps.forEach(m => m.classList.remove('active'));
      // Show the selected map
      map.classList.add('active');
    }
  }
</script>
</head>
<body>
  <h1>🍋 Ro's Lemonade</h1>
  <p>Come grab some fresh lemonade! Here's where we'll be this month:</p>

  <table>
    <tr>
      <th>Date</th>
      <th>Time</th>
      <th>Location</th>
      <th>Map</th>
    </tr>
    <tr>
      <td>May 3</td>
      <td>12 PM – 3 PM</td>
      <td>Ft. Macon</td>
      <td><button onclick="toggleMap('map1')">View Map</button></td>
    </tr>
    <tr>
        <td>May 5</td>
        <td>10:30 AM – 2:30 PM</td>
        <td>Atl. Beach</td>
        <td><button onclick="toggleMap('map2')">View Map</button></td>
      </tr>
    <!-- Add more rows with matching map IDs like 'map2', 'map3' -->
  </table>
  
  <!-- Maps -->
  <div id="map1" class="map">
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d975.2555467870679!2d-76.67968623556855!3d34.69621050560813!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89a89057a37d1093%3A0x2d60846ea89e41eb!2sFt.%20Macon!5e0!3m2!1sen!2sus!4v1746145980849!5m2!1sen!2sus"width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy"referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
  <div id="map2" class="map">
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1950.5941672722922!2d-76.83174074155426!3d34.692685654539055!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89a8922c708f1c17%3A0x1e02d55f5b27b91c!2sAtlantic%20Beach%2C%20NC%2028512!5e0!3m2!1sen!2sus!4v1746147487823!5m2!1sen!2sus" width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
</body>
</html>
